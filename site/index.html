<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocapoca 故事村 Pocapoca Story Village</title>
<meta name="description" content="繪本／插畫工作者 Poca（鄭夙雅）的作品網站：繪本、插畫、動畫，以及 Podcast「Poca村長的故事時間」。">
<meta property="og:title" content="Pocapoca 故事村 Pocapoca Story Village">
<meta property="og:description" content="繪本／插畫工作者 Poca 的作品與 Podcast「Poca村長的故事時間」。">
<meta property="og:image" content="https://www.pocapocastoryvillage.com/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://www.pocapocastoryvillage.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: the old Pocapoca village, rebuilt — a watercolor sea fills the page; the island map is the front gate;
   a ribbon leads ashore to a yellow sky header, a ribbon menu, and a pale paper panel holding each page. */
@font-face{font-family:"Amatic";src:url(fonts/amatic-bold.woff) format("woff");font-weight:400 700;font-display:swap;ascent-override:86%;descent-override:14%;line-gap-override:0%}
:root{
  --sea:#4f86ab;          /* watercolor sea (WEB背景) */
  --panel:#f2f4f3;        /* pale paper panel */
  --panel-2:#e7ebe8;
  --sky:#f7f0a9;          /* yellow sky header */
  --ribbon:#776d66;       /* grey-brown ribbon */
  --ribbon-fold:#57332d;  /* dark fold under the ribbon */
  --ribbon-tail:#8b817a;
  --ink:#4b463e;
  --ink-soft:#7b746a;
  --teal:#3e7a7d;         /* section titles */
  --cream:#f6f1e4;
  --ground:#c8aa52;       /* mustard ground under the passers-by */
  --line:#cfd5d1;
  --en:"Amatic","Amatic SC","Avenir Next Condensed",sans-serif;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --step-0:clamp(.95rem,.92rem + .15vw,1.03rem);
  --step-1:clamp(1.12rem,1.04rem + .35vw,1.3rem);
  --step-2:clamp(1.45rem,1.25rem + .8vw,1.9rem);
  --en-1:clamp(1.7rem,1.4rem + 1.2vw,2.4rem);
  --en-2:clamp(2.4rem,1.8rem + 2.6vw,4.2rem);
  --gutter:clamp(16px,3.5vw,40px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,html{-webkit-text-size-adjust:100%;text-size-adjust:100%} /* stop iPhone landscape from enlarging some text */
body{overflow-x:clip}
body{margin:0;background:var(--sea) url(img/texture.jpg) center top/1600px auto repeat;background-attachment:fixed;color:var(--ink);font-family:var(--zh);font-size:var(--step-0);line-height:1.8}
img,video{max-width:100%;height:auto;display:block}
a{color:var(--teal);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;font-weight:500}
.en{font-family:var(--en);font-weight:700;letter-spacing:.02em;line-height:1}
button{font:inherit;color:inherit}

/* ---------- ribbon (drawn as SVG) ---------- */
.ribbon{position:relative;display:inline-grid;place-items:center;text-decoration:none;color:var(--cream);isolation:isolate;cursor:pointer;border:0;background:none;padding:0}
.ribbon > svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}
.ribbon .r-band{fill:var(--ribbon)}
.ribbon .r-tail{fill:var(--ribbon-tail)}
.ribbon .r-fold{fill:var(--ribbon-fold)}
.ribbon .r-stitch{fill:none;stroke:var(--cream);stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:5 4}
.go{display:grid;place-items:center;padding:0 1.5em;height:2.3em;line-height:1;font-size:clamp(1.6rem,1.2rem + 1.4vw,2.4rem);white-space:nowrap;cursor:default}
.go span{display:block}
.gate .go{margin-top:-30px}
.go:hover{transform:translateY(-3px) rotate(-1deg)}

/* ---------- landing ---------- */
.gate{position:relative;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;padding-inline:var(--gutter);overflow:hidden}
/* home: a fixed layer of the sea texture that also reaches behind the browser's top and bottom bars;
   it does not change the page height, so nothing moves and nothing needs scrolling */
.gate::before{content:"";position:fixed;left:0;right:0;top:-200px;bottom:-200px;background:var(--sea) url(img/texture.jpg) center/1600px auto repeat;z-index:-1;pointer-events:none}
.mapwrap{position:absolute;right:0;bottom:0;width:min(76vw,calc(100svh * 1.3373));aspect-ratio:3350/2505}
.mapwrap .map{width:100%;height:100%;display:block}
.mapwrap .eboat{position:absolute;width:13%;left:15%;top:77%;animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.gate .flight{position:relative;z-index:2;display:grid;justify-items:start;gap:18px;padding-block:clamp(60px,12vh,140px) 40px;width:max-content;max-width:100%;margin-left:0}
@media (min-width:821px){.gate .flight{margin-left:clamp(0px,5.5vw,110px)}}
.gate .bird-row{display:flex;align-items:center;gap:clamp(8px,2vw,24px)}
.gate .bird{width:clamp(200px,24vw,340px);animation:fly 6s ease-in-out infinite}
.bubbles{display:grid;gap:12px}
.bubble-btn{width:clamp(90px,9vw,120px);aspect-ratio:1231/1090;background:url(img/bubble-white.webp) center/contain no-repeat;border:0;cursor:pointer;display:grid;place-items:center;padding:0 0 10% 12%;font-size:clamp(1.25rem,1rem + .7vw,1.75rem);color:var(--ribbon);transition:transform .2s}
.bubble-btn.zh{font-family:var(--zh);font-weight:500}
.bubble-btn.en-b{font-family:var(--en);font-weight:700;font-size:clamp(1.8rem,1.4rem + 1vw,2.5rem);background:none;position:relative;isolation:isolate}
.bubble-btn.en-b{padding:14% 0 0 8%}
.bubble-btn.en-b::before{content:"";position:absolute;inset:0;background:url(img/bubble-white.webp) center/contain no-repeat;transform:rotate(30deg);z-index:-1}
.bubble-btn:hover{transform:scale(1.06)}

@keyframes fly{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(12px,-16px) rotate(3deg)}}
@keyframes twinkle{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(18deg) scale(1.15)}}

/* ---------- inner frame ---------- */
.sky{background:var(--sky);text-align:center;position:relative;padding:28px var(--gutter) 46px}
.sky .title{font-size:var(--en-2);color:var(--ink);text-decoration:none;display:inline-block;position:relative}
.sky .title small{display:block;font-family:var(--zh);font-weight:500;font-size:clamp(.95rem,.85rem + .3vw,1.1rem);letter-spacing:.3em;margin-top:.5em;color:var(--ink-soft)}
.sky .s-balloon{position:absolute;width:clamp(28px,3vw,40px);right:clamp(16px,20vw,300px);top:20px;animation:drift 8s ease-in-out infinite}
.sky .s-star{position:absolute;width:clamp(22px,2.4vw,32px);left:-1.4em;bottom:.2em;animation:twinkle 4s ease-in-out infinite}
.sky .s-bird{width:clamp(150px,17vw,230px);margin:4px auto 0}
.sky .welcome{display:flex;align-items:center;justify-content:center;gap:18px;margin:-6px 0 0;color:var(--ink);font-size:clamp(2.2rem,1.6rem + 2vw,3.4rem)}
.sky .welcome::before,.sky .welcome::after{content:"";width:clamp(40px,12vw,150px);height:8px;background:radial-gradient(circle at 4px 8px,#d9bfa0 4px,transparent 4.5px) 0 0/8px 8px repeat-x}
.menu{position:relative;z-index:3;margin:-26px auto 0;max-width:min(1060px,calc(100% - 2*var(--gutter) + 40px));padding-inline:28px}
.menu .ribbon{display:flex;align-items:center;width:100%;padding:0 26px;height:clamp(62px,5.6vw,76px)}

.menu nav{display:flex;flex-wrap:wrap;justify-content:space-evenly;align-items:center;gap:2px 10px;width:100%}
.menu a,.menu .lang{font-family:var(--en);font-weight:700;font-size:clamp(1.35rem,1.1rem + .8vw,1.75rem);color:var(--cream);text-decoration:none;line-height:1;padding:4px;border:0;background:none;cursor:pointer}
.menu a:hover,.menu .lang:hover{color:var(--sky)}
.menu a[aria-current="page"]{color:#e8a49a}
.sky .langsw{position:absolute;right:max(var(--gutter),calc((100% - 1060px)/2));bottom:40px;z-index:4}
.langsw{display:inline-flex;align-items:center;gap:2px;background:var(--ribbon);border-radius:999px;padding:4px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.langsw svg{width:18px;height:18px;fill:none;stroke:var(--cream);stroke-width:1.6;margin:0 4px 0 6px;flex:none}
.langsw button{font-family:var(--zh);font-weight:500;font-size:.95rem;line-height:1;color:var(--cream);background:none;border:0;border-radius:999px;padding:6px 10px;cursor:pointer}
.langsw button.en-opt{font-family:var(--en);font-weight:700;font-size:1.15rem;padding:4px 11px}
.langsw button[aria-pressed="true"]{background:var(--sky);color:var(--ribbon)}
.langsw button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.18)}
.panel{background:var(--panel);max-width:min(1060px,calc(100% - 2*var(--gutter)));margin:-14px auto 0;padding:clamp(40px,6vw,72px) clamp(16px,5vw,64px) clamp(36px,5vw,64px);position:relative;z-index:1;box-shadow:0 18px 40px rgba(20,40,60,.18)}
.panel-foot{max-width:min(1060px,calc(100% - 2*var(--gutter)));margin:0 auto clamp(30px,5vw,60px);background:var(--panel-2);padding:28px clamp(16px,5vw,64px) 18px}

/* section titles: English in Amatic + Chinese in Hei, like the old site */
.stitle{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;padding-bottom:10px;border-bottom:2px dotted var(--line);margin-bottom:18px;color:var(--teal)}
.stitle .en{font-size:var(--en-1)}
.stitle .zh{font-size:var(--step-1);font-weight:500}
.label{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:12px;background:var(--ribbon);color:var(--cream);padding:6px 20px 8px;box-shadow:4px 4px 0 var(--panel-2)}
.label .en{font-size:var(--en-1)}
.label .zh{font-weight:500}

/* ---------- about ---------- */
.intro-m{display:none}
.notice{position:relative;padding-bottom:clamp(30px,5vw,60px)}
.scene{position:relative;max-width:900px;margin:0 auto;container-type:inline-size}
.scene > .board{margin-bottom:4cqw} /* cqw here = width of the scene, so the legs always end in the middle of the ground */
.board{position:relative;width:88%;aspect-ratio:985/676;margin:0 auto;background:url(img/board.webp) center/100% 100% no-repeat;padding:7.5% 8% 0;container-type:inline-size;z-index:1}
.board .stitle{margin-bottom:3cqi;padding-bottom:1.5cqi}
.board .stitle .en{font-size:clamp(2.2rem,7.4cqi,3.7rem)}
.board .stitle .zh{font-size:clamp(1.3rem,4.1cqi,2.2rem);font-weight:700}
.board p{font-size:var(--step-0);line-height:1.8}
.board-in{display:block}
.board-in .mapthumb{border-radius:3px;background:var(--sea) url(img/texture.jpg) center/400px auto}
.board .lead{font-weight:500;font-size:var(--step-1);line-height:1.6;margin:0 0 .5em}
.board .lead span{display:block;color:var(--teal)}
.board p{margin:0}
.ground{position:absolute;left:0;right:0;bottom:0;height:8cqw;z-index:0}
.scene .p1,.scene .p2{position:absolute;z-index:2}
.scene .p1{width:15cqw;left:28%;bottom:3.6cqw}
.scene .p2{width:25cqw;left:54%;bottom:calc(3.6cqw - 25cqw * 39 / 362)}
.ground::before{content:"";position:absolute;inset:0;background:var(--ground);border-radius:50% 46% 52% 48%/60% 55% 45% 40%;opacity:.9}

.chief{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,5fr);gap:clamp(20px,4vw,48px);align-items:start;margin-top:clamp(30px,5vw,60px)}
.chief .photo{border-radius:3px;width:100%;height:auto}
.chief picture{display:block}
.chief h3{font-size:var(--en-1);color:var(--teal);margin:18px 0 6px}
.chief p{margin:0;max-width:38em}
.cv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,36px) clamp(20px,4vw,48px);margin-top:clamp(32px,5vw,56px)}
.cv .wide{grid-column:1/-1}
.cv ul{list-style:none;margin:0;padding:0}
.cv li{display:grid;grid-template-columns:8.4em minmax(0,1fr);gap:10px;padding:5px 0;font-size:.93em;line-height:1.6}
.cv li > span{text-wrap:pretty}
.cv .nw{white-space:nowrap}
.cv time{font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}

/* ---------- works ---------- */
.intro{max-width:38em;color:var(--ink-soft);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chips a{font-family:var(--en);font-weight:700;font-size:1.35rem;line-height:1.3;text-decoration:none;color:var(--cream);background:var(--ribbon);padding:1px 14px 3px;border-radius:3px}
.chips a span{font-family:var(--zh);font-size:.9rem;font-weight:400;margin-left:6px}
.chips a:hover{background:var(--teal)}
.cat{margin-top:clamp(34px,5vw,60px);scroll-margin-top:20px}
.group{padding-block:clamp(18px,3vw,30px);border-bottom:1px dashed var(--line);scroll-margin-top:20px}
.group:last-child{border-bottom:0}
.group-head{display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.group-head h3{font-size:var(--step-1)}
.group-head .meta{color:var(--ink-soft);font-size:.9em}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row .tile{flex:var(--r) 1 calc(var(--r) * 170px);aspect-ratio:var(--r)}
.row::after{content:"";flex:1000 1 0}
.masonry{columns:4 200px;column-gap:12px}
.masonry .tile{margin-bottom:12px;break-inside:avoid;aspect-ratio:var(--r)}
.tile{position:relative;display:block;width:100%;padding:0;border:0;background:var(--panel-2);cursor:zoom-in;overflow:hidden;border-radius:2px}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.tile:hover img,.tile:hover video{transform:scale(1.03)}
.tile .cap{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);background:var(--panel);color:var(--ink);font-size:.88rem;line-height:1.35;padding:3px 10px;border-radius:2px;opacity:0;transform:translateY(4px);transition:.2s;text-align:left}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1;transform:none}
.play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:rgba(246,241,228,.9);display:grid;place-items:center;pointer-events:none}
.play::after{content:"";border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}

.yt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--sky);padding:18px clamp(16px,3vw,26px);margin-top:28px;border-radius:3px}
.yt img{width:84px}
.yt h3{font-size:var(--step-1)}
.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.vids .tile{aspect-ratio:16/9}
.vids figcaption{margin-top:6px;font-weight:500}

/* ---------- footer ---------- */
.contacts{display:grid;gap:10px}
.contact-row .what{display:block;color:var(--ink-soft);font-size:.88em}
.social{display:flex;gap:12px;flex-wrap:wrap}
.social a{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--ribbon);color:var(--cream);transition:transform .2s,background .2s}
.social a:hover{background:var(--teal);transform:translateY(-2px)}
.social svg{width:22px;height:22px;fill:currentColor}
/* ---------- podcast ---------- */
.pod-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(16px,3vw,32px);align-items:center;margin-bottom:24px}
.pod-hero img{width:clamp(110px,14vw,170px);border-radius:4px}
.pod-hero h2{font-size:var(--step-2);margin-bottom:4px}
.pod-hero p{margin:0 0 10px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ribbon);color:var(--cream);text-decoration:none;border:0;border-radius:999px;padding:5px 16px;font-weight:500;cursor:pointer;font-size:.95rem}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn:hover{background:var(--teal)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ribbon)}
.btn.ghost:hover{background:var(--panel-2)}
.pod-tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:8px 0 18px}
.pod-tools .chip{border:1.5px solid var(--ribbon);background:transparent;border-radius:999px;padding:2px 14px;cursor:pointer;font-size:.92rem}
.pod-tools .chip[aria-pressed="true"]{background:var(--ribbon);color:var(--cream)}
.pod-tools input{flex:1 1 200px;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;font:inherit;font-size:.95rem;background:#fff;color:var(--ink)}
.pod-count{color:var(--ink-soft);font-size:.9rem;margin:0 0 10px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:20px 16px}
.ep{display:grid;grid-template-rows:auto 1fr;background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.ep-img{aspect-ratio:1;background:var(--sea) url(img/texture.jpg) center/300px;border:0;padding:0;cursor:zoom-in;display:block;width:100%}
.ep-img img{width:100%;height:100%;object-fit:cover}
.ep-img.none{display:grid;place-items:center;cursor:default}
.ep-img.none img{width:60%;height:auto;object-fit:contain}
.ep-body{padding:10px 12px 12px;display:grid;gap:4px;align-content:start}
.ep-body h3{font-size:1rem;line-height:1.45;font-weight:500}
.ep-meta{font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ep-body p{margin:0;font-size:.86rem;line-height:1.6;color:var(--ink-soft)}
.ep-body a{font-size:.88rem;font-weight:500;justify-self:start;margin-top:2px}
.more{display:flex;justify-content:center;margin-top:24px}

.foot{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px 40px}
.foot h4{margin:0 0 6px;font-family:var(--en);font-weight:700;font-size:1.6rem;color:var(--teal);line-height:1.1}
.foot h4 span{font-family:var(--zh);font-size:.95rem;font-weight:500;margin-left:6px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail code{font-family:var(--zh);user-select:all;background:var(--panel);padding:1px 8px;border-radius:3px}
.copy{font-size:.85rem;border:1px solid var(--ink-soft);background:transparent;border-radius:999px;padding:0 10px;cursor:pointer}
.small{color:var(--ink-soft);font-size:.82rem;text-align:center;margin:20px 0 0}

.pod-hero .btns,.epd-info .btns{display:flex;flex-wrap:wrap;gap:8px}
.kappa-intro{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,5fr);gap:clamp(16px,3vw,36px);align-items:center;margin:clamp(24px,4vw,44px) 0}
.kappa-intro img{border-radius:3px}
.kappa-intro p{margin:0 0 .8em;max-width:36em}
.chars{margin-bottom:clamp(24px,4vw,44px)}
.chars-img{display:block;border:0;padding:0;background:none;cursor:zoom-in;max-width:620px;margin:0 auto}
.chars-img img{border-radius:3px}
.ep-open{display:grid;grid-template-rows:auto 1fr;width:100%;height:100%;border:0;padding:0;background:#fff;text-align:left;cursor:pointer;color:inherit}
.ep-open .ep-img{position:relative;display:block}
.ep-play{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:rgba(246,241,228,.92);display:grid;place-items:center;transition:transform .2s}
.ep-play::after{content:"";border-left:13px solid var(--ribbon);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.ep-open:hover .ep-play{transform:scale(1.1)}
.ep-open:hover .ep-title{color:var(--teal)}
.ep-body{display:grid;gap:4px;align-content:start;padding:10px 12px 12px}
.ep-title{font-size:1rem;line-height:1.45;font-weight:500}
.ep-desc{font-size:.86rem;line-height:1.6;color:var(--ink-soft)}
.ep-img .noimg,.epd-art .noimg{width:60%;margin:20% auto;height:auto;object-fit:contain}
dialog.epd{border:0;padding:0;background:var(--panel);width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 32px);border-radius:4px;color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.epd::backdrop{background:rgba(26,34,40,.75)}

.epd-art{background:var(--sea) url(img/texture.jpg) center/400px}
.epd-art img{width:100%;height:100%;object-fit:cover;aspect-ratio:1}
.epd-info{padding:clamp(18px,3vw,34px);display:grid;gap:12px;align-content:center}
.epd-info h2{font-size:var(--step-2)}
.epd-info p{margin:0}
.epd-info audio{width:100%}
dialog.epd.has-gal{width:min(1000px,calc(100vw - 32px))}
.epd.has-gal .epd-in{grid-template-columns:minmax(0,1fr)}
.epd.has-gal .epd-art{position:relative;background:#222}
.epd.has-gal .epd-art img{aspect-ratio:auto;height:auto;max-height:62vh;object-fit:contain;margin:0 auto}
.epd.has-gal .epd-info{align-content:start}
.gal-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(246,241,228,.92);color:var(--ribbon);font-size:1.2rem;cursor:pointer;display:grid;place-items:center}
.gal-btn.prev{left:12px}.gal-btn.next{right:12px}

.gal-count{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums}

.lb-stage > .lb-btn{align-self:center}
.lb-media{position:relative;min-height:0;min-width:0}
.lb-media{overflow:hidden}
.lb-media img,.lb-media video{position:absolute;inset:0;margin:auto;max-height:100%;max-width:100%;object-fit:contain}
.lb-media img{touch-action:none;transform-origin:center;transition:transform .15s ease-out;will-change:transform}
.lb-media img.zoomed{cursor:grab}
.lb-media img.pinching{transition:none}
.lb-hint{color:#f6f1e4;opacity:.6;font-size:.75rem;text-align:center;padding-top:4px}
.epd-art img{cursor:zoom-in}
.epd-zoom{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(246,241,228,.92);color:var(--ribbon);cursor:pointer;display:grid;place-items:center;font-size:1.1rem}

let lang="zh";

const t=k=>T[lang][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stripExt=f=>f.replace(/\.[^.]+$/,"");
const RIB='<svg aria-hidden="true"><use href="#rib"/></svg>';
const st=(en,zh,tag="h2",id="")=>`<${tag} class="stitle"${id?` id="${id}"`:""}><span class="en">${en}</span><span class="zh">${zh}</span></${tag}>`;

function item(key,zh,en){const m=M[key];return m?{key,zh,en,...m}:null;}
function groupItems(g,isBook){
  return g.files.map(f=>{
    if(Array.isArray(f)) return item(`${g.dir}/${f[0]}`, f[2]||stripExt(f[0]), f[1]);
    const n=stripExt(f);
    return item(`${g.dir}/${f}`, `${g.zh.replace(/^繪本/,"")} ${isBook?"p."+n:n}`, `${g.en} ${isBook?"p."+n:"#"+n}`);
  }).filter(Boolean);
}
const singles=SINGLES.map(([f,en,zh])=>item(f,zh||stripExt(f),en)).filter(Boolean);
const anims=ANIM.map(([f,en])=>item(f,stripExt(f),en)).filter(Boolean);
let LB_SETS={},setId=0;
const registerSet=items=>{const id="s"+(setId++);LB_SETS[id]=items;return id;};
function tile(it,set,idx){
  const r=(it.w/it.h).toFixed(3), title=it[lang];
  const media=(it.video&&it.loop)
    ?`<video controlslist="nodownload" disablepictureinpicture src="${it.video}" poster="${it.thumb}" autoplay muted loop playsinline preload="metadata" aria-hidden="true"></video>`
    :`<img src="${it.thumb}" alt="${esc(title)}" width="${it.w}" height="${it.h}" loading="lazy" decoding="async">`;
  const play=(it.video&&!it.loop)?`<span class="play" aria-hidden="true"></span>`:"";
  return `<button class="tile" type="button" style="--r:${r}" data-set="${set}" data-i="${idx}" aria-label="${esc(title)}">${media}${play}<span class="cap">${esc(title)}</span></button>`;
}

      ${gal.length>1?`<button class="gal-btn prev" type="button" aria-label="上一張" ${k===0?"disabled":""}>←</button><button class="gal-btn next" type="button" aria-label="下一張" ${k===gal.length-1?"disabled":""}>→</button>

      const p=art.querySelector(".prev"),n=art.querySelector(".next");
      if(p)p.onclick=()=>{if(k>0){k--;draw();}}; if(n)n.onclick=()=>{if(k<gal.length-1){k++;draw();}};};
    art.onclick=ev=>{if(ev.target.closest(".gal-btn"))return; LB_SETS.ep=gal.map((src,j)=>({src,zh:title,en:title}));lbSet="ep";lbI=k;showLB();lb.showModal();};
    draw();
    d.onkeydown=ev=>{if(ev.key==="ArrowLeft"&&k>0){k--;draw();} if(ev.key==="ArrowRight"&&k<gal.length-1){k++;draw();}};
    let sx=null; art.ontouchstart=ev=>{sx=ev.touches[0].clientX}; art.ontouchend=ev=>{if(sx==null)return;const dx=ev.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){if(dx<0&&k<gal.length-1)k++;else if(dx>0&&k>0)k--;draw();}sx=null;};
  } else {
    d.onkeydown=null;

    art.innerHTML=img?`<img src="${img}" alt=""><button class="epd-zoom" type="button" aria-label="全螢幕">⤢</button>`:`<img class="noimg" src="img/bird.webp" alt="">`;

    document.getElementById("app").innerHTML = route==="home" ? viewGate() : frame(route,VIEWS[route]());

  const screenH=Math.min(window.innerHeight,document.documentElement.clientHeight);

lb.addEventListener("click",e=>{if(e.target===lb||e.target.classList.contains("lb-media")||e.target.classList.contains("lb-stage"))lb.close();});
["lbPrev","lbPrevM"].forEach(id=>document.getElementById(id).onclick=()=>step(-1));
["lbNext","lbNextM"].forEach(id=>document.getElementById(id).onclick=()=>step(1));
lb.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);});
/* zoom & pan inside the lightbox */
let Z={s:1,x:0,y:0},pinch=null,pan=null,lastTap=0;
function zImg(){return lbMedia.querySelector("img");}
function zApply(){const im=zImg();if(!im)return;
  const r=im.getBoundingClientRect(),w=r.width/Z.s,h=r.height/Z.s,mx=w*(Z.s-1)/2,my=h*(Z.s-1)/2;
  Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y));
  im.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;im.classList.toggle("zoomed",Z.s>1);}
function zoomReset(){Z={s:1,x:0,y:0};const im=zImg();if(im){im.style.transform="";im.classList.remove("zoomed");}}
function zoomAt(s,cx,cy){const im=zImg();if(!im)return;const r=im.getBoundingClientRect();
  const ox=cx-(r.left+r.width/2),oy=cy-(r.top+r.height/2),k=s/Z.s;
  Z.x=Z.x-ox*(k-1);Z.y=Z.y-oy*(k-1);Z.s=s;if(Z.s<=1.01)zoomReset();else zApply();}
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
let tx=null;
lbMedia.addEventListener("touchstart",e=>{
  if(!zImg())return;
  if(e.touches.length===2){pinch={d:dist(e.touches),s:Z.s};zImg().classList.add("pinching");tx=null;}
  else if(e.touches.length===1){
    const now=Date.now(),t=e.touches[0];
    if(now-lastTap<300){zoomAt(Z.s>1?1:2.5,t.clientX,t.clientY);lastTap=0;tx=null;e.preventDefault();return;}
    lastTap=now;
    if(Z.s>1){pan={x:t.clientX-Z.x,y:t.clientY-Z.y};zImg().classList.add("pinching");tx=null;}else tx=t.clientX;}
},{passive:false});
lbMedia.addEventListener("touchmove",e=>{
  if(pinch&&e.touches.length===2){e.preventDefault();const t=e.touches,cx=(t[0].clientX+t[1].clientX)/2,cy=(t[0].clientY+t[1].clientY)/2;
    zoomAt(Math.max(1,Math.min(4,pinch.s*dist(t)/pinch.d)),cx,cy);}
  else if(pan&&e.touches.length===1){e.preventDefault();Z.x=e.touches[0].clientX-pan.x;Z.y=e.touches[0].clientY-pan.y;zApply();}
},{passive:false});
lbMedia.addEventListener("touchend",e=>{
  const im=zImg();if(im)im.classList.remove("pinching");
  if(pinch&&e.touches.length<2){pinch=null;return;}
  if(pan){pan=null;return;}
  if(tx==null||Z.s>1)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)step(dx<0?1:-1);tx=null;});
lbMedia.addEventListener("dblclick",e=>{if(e.target.tagName==="IMG"&&!matchMedia("(hover:none)").matches)zoomAt(Z.s>1?1:2.5,e.clientX,e.clientY);});
lbMedia.addEventListener("wheel",e=>{if(e.target.tagName!=="IMG")return;e.preventDefault();zoomAt(Math.max(1,Math.min(4,Z.s*(e.deltaY<0?1.15:1/1.15))),e.clientX,e.clientY);},{passive:false});
let mdrag=null;lbMedia.addEventListener("mousedown",e=>{if(Z.s>1&&e.target.tagName==="IMG"){e.preventDefault();mdrag={x:e.clientX-Z.x,y:e.clientY-Z.y};e.target.classList.add("pinching");}});
window.addEventListener("mousemove",e=>{if(mdrag){Z.x=e.clientX-mdrag.x;Z.y=e.clientY-mdrag.y;zApply();}});
window.addEventListener("mouseup",()=>{if(mdrag){mdrag=null;const im=zImg();if(im)im.classList.remove("pinching");}});

render();
fetch("data/podcast.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{EPS=d.episodes||[];EPS_LOADED=true;if(current==="podcast")render(true);}).catch(()=>{EPS_LOADED=true;if(current==="podcast")render(true);});
</script>
<script>
/* 保護圖片：擋右鍵、拖曳、長按存圖 */
["contextmenu","dragstart"].forEach(t=>document.addEventListener(t,e=>{if(e.target.closest&&e.target.closest("img,video,.lb-media,.epd-art,.tile"))e.preventDefault();},{capture:true}));
</script>
