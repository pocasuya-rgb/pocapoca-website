name: 更新網站 (Build & deploy)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"   # 06:00 台灣時間
    - cron: "32 0 * * *"   # 08:32 台灣時間（新集數 08:30 上架後馬上抓）
    - cron: "45 0 * * *"   # 08:45 台灣時間（第二次，以防 8:32 時 Firstory 還沒更新）
    - cron: "15 1 * * *"   # 09:15 台灣時間（備用）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 新的更新會排隊等前一個做完，不會把正在上傳的中斷

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 分鐘（網站圖片很多，上傳有時超過預設的 10 分鐘）
