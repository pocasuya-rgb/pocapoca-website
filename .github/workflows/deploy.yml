name: 更新網站 (Build & deploy)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"   # 06:00 台灣時間
    - cron: "40 0 * * *"   # 08:40 台灣時間（新集數 08:30 上架後）
    - cron: "15 1 * * *"   # 09:15 台灣時間（備用，以防 8:40 時 Firstory 還沒更新）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
