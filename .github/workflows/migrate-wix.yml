name: 搬移 Wix 插畫 (Migrate Wix illustrations)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "幾集？（0 = 全部）"
        default: "3"
      only:
        description: "只搬這幾集，例如 EP184,EP90（可留空）"
        default: ""
      fix_colors:
        description: "只修正顏色（CMYK 變螢光色的圖）"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/migrate_wix.py --limit "${{ inputs.limit }}" --only "${{ inputs.only }}" ${{ inputs.fix_colors && '--fix-colors' || '' }}
      - name: Save the illustrations to the repository
        run: |
          git config user.name "pocapoca-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "podcast插畫" data/wix-migration-report.md
          git commit -m "從 Wix 搬移 / 修正 Podcast 插畫" || echo "Nothing new"
          git push
      - name: Rebuild the website
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
